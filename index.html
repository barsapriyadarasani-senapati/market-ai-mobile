<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market AI Mobile</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#eef2f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:18px 16px;position:sticky;top:0;background:#0b0f14;border-bottom:1px solid #202832;z-index:3}
h1{margin:0;font-size:22px}.sub{color:#8e9aaa;font-size:12px;margin-top:4px}
main{padding:14px;max-width:900px;margin:auto}.row{display:flex;gap:8px}.row>*{min-width:0}
input,button{border:1px solid #2a3440;border-radius:10px;background:#111820;color:#fff;padding:13px;font-size:15px}
input{flex:1}button{background:#6d28d9;border:0;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.card{background:#111820;border:1px solid #202a35;border-radius:14px;padding:14px}.big{font-size:25px;font-weight:800}.muted{color:#91a0b2;font-size:12px}
.signal{font-size:22px;font-weight:900}.buy{color:#45e09a}.sell{color:#ff6b7a}.hold{color:#f3c969}
canvas{background:#0f151c;border-radius:12px;padding:6px}.list{margin-top:8px}.item{padding:10px 0;border-bottom:1px solid #202832}
.chat{max-height:260px;overflow:auto}.msg{padding:9px;border-radius:10px;background:#161f29;margin:6px 0}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><h1>📈 Market AI Mobile</h1><div class="sub">Technical analysis • Charts • Signals • Backtest</div></header>
<main>
<div class="row"><input id="sym" value="RELIANCE" placeholder="NSE symbol, e.g. TCS"><button onclick="analyse()">Analyse</button></div>
<div id="status" class="muted" style="margin:10px 0">Enter a symbol and analyse it.</div>
<div class="grid">
<div class="card"><div class="muted">PRICE</div><div id="price" class="big">—</div><div id="chg" class="muted">—</div></div>
<div class="card"><div class="muted">SIGNAL</div><div id="signal" class="signal">—</div><div id="score" class="muted">—</div></div>
<div class="card"><div class="muted">RSI</div><div id="rsi" class="big">—</div></div>
<div class="card"><div class="muted">VOLATILITY</div><div id="risk" class="big">—</div></div>
</div>
<div class="card"><canvas id="chart"></canvas></div>
<div class="card" style="margin-top:10px"><b>Technical reasons</b><div id="reasons" class="list muted"></div></div>
<div class="card" style="margin-top:10px">
<b>Backtest</b><div id="backtest" class="list muted">—</div>
</div>
<div class="card" style="margin-top:10px">
<b>AI-style chat</b><div id="chat" class="chat"><div class="msg">Ask about the selected stock.</div></div>
<div class="row" style="margin-top:8px"><input id="question" placeholder="e.g. Is this stock overbought?"><button onclick="ask()">Ask</button></div>
</div>
</main>
<script>
let chart;
const $=id=>document.getElementById(id);
async function get(url){const r=await fetch(url);if(!r.ok)throw new Error(await r.text());return r.json()}
async function analyse(){
 const s=$("sym").value.trim().toUpperCase(); if(!s)return;
 $("status").textContent="Fetching market data…";
 try{
  const [a,c,r,b]=await Promise.all([
   get("/api/analysis?symbol="+encodeURIComponent(s)),
   get("/api/chart?symbol="+encodeURIComponent(s)+"&period=6mo"),
   get("/api/risk?symbol="+encodeURIComponent(s)),
   get("/api/backtest?symbol="+encodeURIComponent(s)+"&period=2y")
  ]);
  $("price").textContent="₹"+a.price;
  $("chg").textContent="Technical snapshot • "+s;
  $("signal").textContent=a.signal;
  $("signal").className="signal "+a.signal.toLowerCase();
  $("score").textContent="Score: "+a.score;
  $("rsi").textContent=a.rsi??"—";
  $("risk").textContent=(r.risk||"—")+" ("+(r.annualized_volatility_pct??"—")+"%)";
  $("reasons").innerHTML=a.reasons.map(x=>"<div class='item'>• "+x+"</div>").join("");
  $("backtest").innerHTML="<div class='item'>Return: <b>"+b.total_return_pct+"%</b></div><div class='item'>Trades: "+b.trades+"</div><div class='item'>Win rate: "+b.win_rate_pct+"%</div>";
  const labels=c.data.map(x=>x.date), prices=c.data.map(x=>x.close);
  if(chart)chart.destroy();
  chart=new Chart(document.getElementById("chart"),{type:"line",data:{labels,datasets:[{label:s+" close",data:prices,borderWidth:2,pointRadius:0,tension:.15}]},options:{responsive:true,plugins:{legend:{labels:{color:"#ddd"}}},scales:{x:{ticks:{color:"#7f8b9b",maxTicksLimit:6}},y:{ticks:{color:"#7f8b9b"}}}}});
  $("status").textContent="Updated successfully.";
 }catch(e){$("status").textContent="Data error: "+e.message}
}
async function ask(){
 const q=$("question").value.trim(),s=$("sym").value.trim();if(!q)return;
 $("chat").innerHTML+="<div class='msg'><b>You:</b> "+q+"</div>";
 try{const a=await get("/api/chat?message="+encodeURIComponent(q)+"&symbol="+encodeURIComponent(s));$("chat").innerHTML+="<div class='msg'><b>Market AI:</b> "+a.reply+"</div>"}catch(e){$("chat").innerHTML+="<div class='msg'>Error: "+e.message+"</div>"}
 $("question").value="";$("chat").scrollTop=$("chat").scrollHeight;
}
</script>
</body></html>
